<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>RGB Color Generator</title>
        <link rel="stylesheet" href="style.css" />
    </head>
    <body>
        <div class="container">
            <h1>RGB Color Generator</h1>
            <div class="colorBox" id="colorPreview"></div>

            <div class="inputRanges">
                <div class="slider">
                    <label for="redSlider">R</label>
                    <input
                        type="range"
                        id="redSlider"
                        min="0"
                        max="255"
                        value="100"
                    />
                    <span id="codeR">100</span>
                </div>
                <div class="slider">
                    <label for="greenSlider">G</label>
                    <input
                        type="range"
                        id="greenSlider"
                        min="0"
                        max="255"
                        value="100"
                    />
                    <span id="codeG">100</span>
                </div>
                <div class="slider">
                    <label for="blueSlider">B</label>
                    <input
                        type="range"
                        id="blueSlider"
                        min="0"
                        max="255"
                        value="100"
                    />
                    <span id="codeB">100</span>
                </div>
            </div>

            <div class="colorCopyArea">
                <span id="showCopyColor">rgb(100, 100, 100)</span>
                <button id="copyColor">Copy</button>
            </div>
        </div>

        <script src="script.js"></script>
    </body>
</html>
